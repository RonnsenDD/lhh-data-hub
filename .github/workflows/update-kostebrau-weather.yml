name: Update Kostebrau weather

on:
  schedule:
    # Temporary shadow run; keeps the existing 5-minute source cadence.
    - cron: "4/5 * * * *" # UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lhh-data-hub-kostebrau-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run Kostebrau parser tests
        run: python -B -m unittest discover -s tests -p 'test_kostebrau_weather.py' -v
      - name: Fetch Kostebrau station and DWD ICON data
        run: python3 -m src.kostebrau_weather --output "$GITHUB_WORKSPACE/data/generated/kostebrau-weather.json"
      - name: Log source age and feed status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/generated/kostebrau-weather.json").read_text(encoding="utf-8"))
          for key in ("status", "statusReason", "measuredAt", "measuredAtTimezone", "measuredAtUtc", "retrievedAt", "ageMinutes"):
              print(f"{key}={data.get(key)}")
          PY
      - name: Publish only the Kostebrau snapshot
        run: bash scripts/publish_one_snapshot.sh --message "Update Kostebrau weather snapshot" data/generated/kostebrau-weather.json

  schedule-audit:
    name: Schedule health (separate from producer result)
    continue-on-error: true
    if: always() && github.event_name == 'schedule'
    needs: update-weather
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit schedule history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PRODUCER_JOB_NAME: update-weather
          PRODUCER_JOB_RESULT: ${{ needs.update-weather.result }}
          WORKFLOW_FILE: update-kostebrau-weather.yml
          SCHEDULE_INTERVAL_MINUTES: "5"
          MAX_SCHEDULE_GAP_MINUTES: "10"
          MAX_QUEUE_DELAY_MINUTES: "5"
        run: python3 scripts/audit_workflow_schedule.py
