name: DWD-Graslandfeuerindex

on:
  schedule:
    # DWD beschreibt die tägliche Bereitstellung um etwa 05:00 UTC.
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lhh-data-hub-graslandfeuerindex
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Required by the guarded main publisher.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: GLFI-Parser- und Regressionstests
        id: tests
        run: python3 -B -m unittest discover -s tests -p 'test_graslandfeuerindex_fetch.py' -v

      - name: DWD-Feed abrufen und JSON schreiben
        id: fetch
        continue-on-error: true
        run: python3 -B src/graslandfeuerindex_fetch.py --output data/generated/graslandfeuerindex.json

      - name: JSON-Vertrag prüfen
        id: validate
        if: always() && steps.tests.outcome == 'success' && steps.fetch.outcome != 'skipped'
        run: python3 -B src/graslandfeuerindex_fetch.py --validate-only --output data/generated/graslandfeuerindex.json

      - name: Feedstatus konfliktbewusst im Data Hub veröffentlichen
        if: always() && steps.validate.outcome == 'success'
        run: |
          bash scripts/publish_one_snapshot.sh \
            --message 'Aktualisiere DWD-Graslandfeuerindex' \
            data/generated/graslandfeuerindex.json

      - name: Technischen DWD-Fehler im Laufstatus melden
        if: always() && steps.fetch.outcome == 'failure'
        run: exit 1
      - name: Scheduled start delay prüfen
        if: always() && github.event_name == 'schedule'
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: python3 scripts/check_schedule_lateness.py --run-started-at "$RUN_STARTED_AT" --daily-time "05:15" --max-delay-minutes 30
