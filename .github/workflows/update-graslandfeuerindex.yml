name: DWD-Graslandfeuerindex

on:
  schedule:
    # DWD beschreibt die tägliche Bereitstellung um etwa 05:00 UTC.
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lhh-data-hub-graslandfeuerindex
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main # Publishing is allowed only from the default branch.
          fetch-depth: 0 # Required by the guarded main publisher.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: GLFI-Parser- und Regressionstests
        id: tests
        run: python3 -B -m unittest discover -s tests -p 'test_graslandfeuerindex_fetch.py' -v

      - name: DWD-Feed abrufen und JSON schreiben
        id: fetch
        continue-on-error: true
        run: python3 -B src/graslandfeuerindex_fetch.py --output data/generated/graslandfeuerindex.json

      - name: JSON-Vertrag prüfen
        id: validate
        if: always() && steps.tests.outcome == 'success' && steps.fetch.outcome != 'skipped'
        run: python3 -B src/graslandfeuerindex_fetch.py --validate-only --output data/generated/graslandfeuerindex.json

      - name: Feedstatus konfliktbewusst im Data Hub veröffentlichen
        if: always() && steps.validate.outcome == 'success'
        run: |
          bash scripts/publish_one_snapshot.sh \
            --message 'Aktualisiere DWD-Graslandfeuerindex' \
            data/generated/graslandfeuerindex.json

      - name: Technischen DWD-Fehler im Laufstatus melden
        if: always() && steps.fetch.outcome == 'failure'
        run: exit 1
  schedule-audit:
    name: Schedule health (separate from producer result)
    if: always() && github.event_name == 'schedule'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit schedule history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: update-graslandfeuerindex.yml
          SCHEDULE_INTERVAL_MINUTES: "1440"
          MAX_SCHEDULE_GAP_MINUTES: "1500"
          MAX_QUEUE_DELAY_MINUTES: "60"
        run: python3 scripts/audit_workflow_schedule.py
