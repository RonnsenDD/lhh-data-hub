name: DWD RADOLAN-RY Radar (Best Effort)

on:
  workflow_dispatch:
    # Testbetrieb: Zeitplan erst nach erfolgreichem manuellen End-to-End-Test ergänzen.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lhh-data-hub-radolan-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pages-Ziel konfigurieren
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: RADOLAN-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check --requirement tools/radolan-ry/requirements.txt

      - name: Veröffentlichungsregressionen
        run: python -B -m unittest discover -s tools/radolan-ry -p "test_publish*.py" -v

      - name: Vorheriges Build-Artefakt ausschließen
        run: rm -rf "$RUNNER_TEMP/radar-site" "$RUNNER_TEMP/radolan-download"

      - name: Neueste DWD-RY-Datei laden, validieren und rendern
        id: radar
        continue-on-error: true
        run: |
          python -B tools/radolan-ry/publish_pages.py \
            --site-dir "$RUNNER_TEMP/radar-site" \
            --download-dir "$RUNNER_TEMP/radolan-download"

      - name: Build-Ausgabe auf genau einen Frame prüfen
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("\${{ runner.temp }}/radar-site/radar")
          manifest_path = root / "latest.json"
          if not manifest_path.is_file():
              raise SystemExit("latest.json fehlt")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          frames = root / "frames"
          names = sorted(p.name for p in frames.iterdir() if p.is_dir()) if frames.exists() else []
          if manifest.get("status") == "unavailable":
              if names or manifest.get("rainImage") is not None:
                  raise SystemExit("Fehlerzustand darf keinen alten Frame referenzieren")
              print("Quelle/Dekodierung nicht verfügbar; expliziter Status wird veröffentlicht.")
          else:
              if manifest.get("status") not in ("current", "stale"):
                  raise SystemExit("Unbekannter Radarstatus")
              if len(names) != 1 or names[0] != manifest.get("frameId"):
                  raise SystemExit("Ausgabe enthält nicht exakt den durch latest.json referenzierten Frame")
              for key in ("rainImage", "coverageImage"):
                  path = root / manifest[key]
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"Frame-Ressource fehlt: {key}")
          PY

      - name: Pages-Artefakt hochladen (nur aktueller Stand, 1 Tag Aufbewahrung)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: \${{ runner.temp }}/radar-site
          retention-days: 1

      - name: Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Veröffentlichte JSON- und PNG-Dateien prüfen
        if: always()
        env:
          PAGE_URL: \${{ steps.deployment.outputs.page_url }}
        run: python -B tools/radolan-ry/verify_public.py

      - name: Technischen Fehlerzustand im Workflow kenntlich machen
        if: always() && steps.radar.outcome == 'failure'
        run: exit 1

