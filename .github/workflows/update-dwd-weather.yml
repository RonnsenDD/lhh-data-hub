# This publication lock matches the currently active remote update-levels.yml.
name: Update DWD weather

on:
  schedule:
    - cron: "*/15 * * * *" # UTC; GitHub may delay or coalesce scheduled starts.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lhh-data-hub-pegel
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0 # Required so a later remote advancement can be rebased safely.

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run DWD and safe-publisher tests (offline/local fixtures)
        run: |
          python -B -m unittest discover -s tests -p 'test_dwd_*.py' -v
          python -B -m unittest discover -s tests -p 'test_publish_one_snapshot.py' -v

      - name: Fetch official DWD sources
        run: python3 -m src.dwd_weather_live --output "$GITHUB_WORKSPACE/data/generated/dwd-weather.json"

      - name: Validate JSON v2 schema and publication semantics
        run: >-
          python3 src/validate_dwd_weather_schema.py
          data/generated/dwd-weather.json
          --schema docs/dwd-weather-v2.schema.json
          --for-publication
          --max-attempt-age-minutes 10

      - name: Publish only the DWD snapshot (bounded safe push)
        run: bash scripts/publish_one_snapshot.sh data/generated/dwd-weather.json "Update DWD weather snapshot"
