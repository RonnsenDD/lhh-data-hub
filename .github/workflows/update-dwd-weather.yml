name: Update DWD weather

on:
  schedule:
    # Offset from minute 00 (GitHub documents its highest schedule load at each hour start).
    - cron: "3,18,33,48 * * * *" # UTC; quarterly cadence retained.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lhh-data-hub-dwd-weather
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0 # Required so a later remote advancement can be rebased safely.

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run DWD and safe-publisher tests (offline/local fixtures)
        run: |
          python -B -m unittest discover -s tests -p 'test_dwd_*.py' -v
          python -B -m unittest discover -s tests -p 'test_publish_one_snapshot.py' -v
          python -B -m unittest discover -s tests -p 'test_audit_workflow_schedule.py' -v

      - name: Fetch official DWD sources
        run: python3 -m src.dwd_weather_live --output "$GITHUB_WORKSPACE/data/generated/dwd-weather.json"

      - name: Validate JSON v2 schema and publication semantics
        run: >-
          python3 src/validate_dwd_weather_schema.py
          data/generated/dwd-weather.json
          --schema docs/dwd-weather-v2.schema.json
          --for-publication
          --max-attempt-age-minutes 10

      - name: Wetter-Quelldatenstand und Alter protokollieren
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data = json.loads(Path("data/generated/dwd-weather.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          def age_minutes(value):
              if not value:
                  return "nicht verfügbar"
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              return f"{(now - parsed.astimezone(timezone.utc)).total_seconds() / 60:.1f}"
          print(f"weather status={data.get('status')} lastAttemptAt={data.get('lastAttemptAt')}")
          for name, item in data.get("observations", {}).items():
              print(f"observation={name} status={item.get('status')} measuredAt={item.get('measuredAt')} actualAgeMinutes={age_minutes(item.get('measuredAt'))} threshold={item.get('freshnessThresholdMinutes')}m")
          forecast = data.get("forecast", {})
          print(f"forecast status={forecast.get('status')} issuedAt={forecast.get('issuedAt')} actualAgeMinutes={age_minutes(forecast.get('issuedAt'))} thresholdHours=12")
          PY

      - name: Publish only the DWD snapshot (bounded safe push)
        run: bash scripts/publish_one_snapshot.sh --message "Update DWD weather snapshot" data/generated/dwd-weather.json
  schedule-audit:
    name: Schedule health (separate from producer result)
    continue-on-error: true
    if: always() && github.event_name == 'schedule'
    needs: update-weather
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit schedule history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PRODUCER_JOB_NAME: update-weather
          PRODUCER_JOB_RESULT: ${{ needs.update-weather.result }}
          WORKFLOW_FILE: update-dwd-weather.yml
          SCHEDULE_INTERVAL_MINUTES: "15"
          MAX_SCHEDULE_GAP_MINUTES: "20"
          MAX_QUEUE_DELAY_MINUTES: "5"
        run: python3 scripts/audit_workflow_schedule.py
