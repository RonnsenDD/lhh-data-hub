name: Public Pegel Daten
on:
  workflow_dispatch:
  schedule:
    # Separater Offset zu Wetter (:03) und Radar (:07); nicht am Stundenbeginn.
    - cron: "11,26,41,56 * * * *" # UTC; Viertelstundentakt bleibt erhalten.
concurrency:
  group: lhh-data-hub-pegel
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main # Publishing is allowed only from the default branch.
          fetch-depth: 0 # Required by the guarded main publisher.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pegeldaten abrufen und validieren
        run: python src/pegel_fetch.py --output-dir data/generated
      - name: JSON-Dateien konfliktbewusst veröffentlichen
        run: |
          bash scripts/publish_one_snapshot.sh \
            --message "Aktualisiere öffentliche Pegeldaten" \
            data/generated/pegel-lauchhammer.json \
            data/generated/pegel-biehlen-1.json
      - name: Technische Fehler und ausgebliebene Abrufe melden
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          bad = []
          now = datetime.now(timezone.utc)
          for path in (Path("data/generated/pegel-lauchhammer.json"), Path("data/generated/pegel-biehlen-1.json")):
              if not path.exists():
                  bad.append(f"{path}: fehlt")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              # stale is an expected successful source response, not a job failure.
              # Only a technical fetch/processing error fails this run.
              if data.get("status") not in ("ok", "stale"):
                  bad.append(f"{path}: status={data.get('status')}")
              attempt = data.get("lastAttemptAt")
              try:
                  attempted_at = datetime.fromisoformat(attempt.replace("Z", "+00:00"))
                  if (now - attempted_at).total_seconds() > 600:
                      bad.append(f"{path}: lastAttemptAt older than 10 minutes")
              except (AttributeError, TypeError, ValueError):
                  bad.append(f"{path}: lastAttemptAt missing/invalid")
          if bad:
              raise SystemExit("; ".join(bad))
          print("Pegelabrufe technisch erfolgreich; stale values remain explicitly marked stale.")
          PY
  schedule-audit:
    name: Schedule health (separate from producer result)
    if: always() && github.event_name == 'schedule'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit schedule history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: update-levels.yml
          SCHEDULE_INTERVAL_MINUTES: "15"
          MAX_SCHEDULE_GAP_MINUTES: "20"
          MAX_QUEUE_DELAY_MINUTES: "5"
        run: python3 scripts/audit_workflow_schedule.py
