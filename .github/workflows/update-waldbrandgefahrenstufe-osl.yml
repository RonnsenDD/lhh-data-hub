name: Waldbrandgefahrenstufe OSL

on:
  schedule:
    # Die offizielle Seite aktualisiert ihre Tagesstufen morgens; 07:20 UTC
    # liegt nach 08:00 Europe/Berlin sowohl im Sommer als auch im Winter.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lhh-data-hub-waldbrandgefahrenstufe-osl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Waldbrand-Parser- und Regressionstests
        id: tests
        run: python3 -B -m unittest discover -s tests -p 'test_waldbrandgefahrenstufe_fetch.py' -v

      - name: MLEUV-Quelle abrufen und JSON schreiben
        id: fetch
        continue-on-error: true
        run: python3 -B src/waldbrandgefahrenstufe_fetch.py --output data/generated/waldbrandgefahrenstufe-osl.json

      - name: JSON-Vertrag prüfen
        id: validate
        if: always() && steps.tests.outcome == 'success' && steps.fetch.outcome != 'skipped'
        run: python3 -B src/waldbrandgefahrenstufe_fetch.py --validate-only --output data/generated/waldbrandgefahrenstufe-osl.json

      - name: Ausschließlich OSL-Snapshot konfliktbewusst veröffentlichen
        if: always() && steps.validate.outcome == 'success'
        run: |
          bash scripts/publish_one_snapshot.sh \
            --message 'Aktualisiere Waldbrandgefahrenstufe OSL' \
            data/generated/waldbrandgefahrenstufe-osl.json

      - name: Abruffehler im Workflowstatus melden
        if: always() && steps.fetch.outcome == 'failure'
        run: exit 1

  schedule-audit:
    name: Schedule health (separate from producer result)
    continue-on-error: true
    if: always() && github.event_name == 'schedule'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit schedule history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PRODUCER_JOB_NAME: update
          PRODUCER_JOB_RESULT: ${{ needs.update.result }}
          WORKFLOW_FILE: update-waldbrandgefahrenstufe-osl.yml
          SCHEDULE_INTERVAL_MINUTES: '1440'
          MAX_SCHEDULE_GAP_MINUTES: '1500'
          MAX_QUEUE_DELAY_MINUTES: '60'
        run: python3 scripts/audit_workflow_schedule.py
